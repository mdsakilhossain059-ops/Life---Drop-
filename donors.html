{% extends "base.html" %}{% block content %}<h2>রক্তদাতা খুঁজুন</h2><form method="get"><select name="blood"><option value="">সব গ্রুপ</option>{% for b in blood %}<option>{{b}}</option>{% endfor %}</select><select name="district"><option value="">সব জেলা</option>{% for d in districts %}<option>{{d}}</option>{% endfor %}</select><button>খুঁজুন</button></form>{% for d in donors %}<article><b>{{d.name}}</b> — {{d.blood}}<br>{{d.upazila}}, {{d.district}}<br><a href="tel:{{d.phone}}">কল করুন: {{d.phone}}</a></article>{% else %}<p>কোনো ডোনার পাওয়া যায়নি।</p>{% endfor %}{% endblock %}
