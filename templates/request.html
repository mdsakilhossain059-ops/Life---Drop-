{% extends "base.html" %}{% block content %}<h2>রক্তের অনুরোধ</h2><form method="post"><input name="patient" placeholder="রোগীর নাম" required><select name="blood">{% for b in blood %}<option>{{b}}</option>{% endfor %}</select><select name="district">{% for d in districts %}<option>{{d}}</option>{% endfor %}</select><input name="upazila" placeholder="উপজেলা" required><input name="hospital" placeholder="হাসপাতালের নাম" required><input name="phone" placeholder="যোগাযোগ নম্বর" required><textarea name="details" placeholder="কখন/কত ব্যাগ প্রয়োজন, বিস্তারিত"></textarea><button>অনুরোধ প্রকাশ করুন</button></form>{% endblock %}
