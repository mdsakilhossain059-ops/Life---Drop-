{% extends "base.html" %}{% block content %}<h2>ডোনার নিবন্ধন</h2><form method="post"><input name="name" placeholder="আপনার নাম" required><input type="email" name="email" placeholder="ইমেইল" required><input type="password" name="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)" minlength="8" required><input name="phone" placeholder="মোবাইল নম্বর" required><select name="blood">{% for b in blood %}<option>{{b}}</option>{% endfor %}</select><select name="district">{% for d in districts %}<option>{{d}}</option>{% endfor %}</select><input name="upazila" placeholder="উপজেলা" required><button>নিবন্ধন করুন</button></form>{% endblock %}
